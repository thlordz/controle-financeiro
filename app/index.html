<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Financeiro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F5C518'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-size='44' font-weight='700' text-anchor='middle' fill='%23111111'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Plus+Jakarta+Sans:wght@400..800&family=Inter+Tight:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<!-- Camadas de fundo: papel de parede e o véu que escurece a foto. -->
<div class="papel" id="papel"></div>
<div class="papel__veu" id="veu"></div>

<!-- Tela de abertura: fica por cima de tudo até o app estar pronto. -->
<div class="abertura" id="abertura">
  <div class="abertura__marca">$</div>
  <div class="abertura__nome">Controle Financeiro</div>
  <div class="abertura__frase" id="aberturaFrase"></div>
  <div class="abertura__barra"><div class="abertura__cheio" id="aberturaCheio"></div></div>
  <div class="abertura__passo" id="aberturaPasso">Acordando…</div>
</div>

<!-- Tela de conexão com o banco. -->
<div class="entrada" id="entrada" hidden></div>

<div class="app">
  <div class="corpo">
    <header class="barra" id="barra"></header>
    <div class="palco">
      <div class="coluna-lista" id="conteudo"></div>
    </div>
  </div>
</div>

<nav class="menu" id="menu"></nav>

<button class="flutuante" id="fab">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
  Adicionar
</button>

<div class="cortina" id="cortina"></div>
<div class="folha" id="folha"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
